# Configurazione Nginx per servire la PWA Angular e inoltrare le API al backend.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # File statici dell'app Angular con fallback SPA:
    # qualsiasi rotta lato client ricade su index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Le chiamate /api vengono inoltrate al backend Spring Boot.
    # "backend" è il nome del servizio in docker-compose.yml.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
