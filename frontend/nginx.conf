# Nginx configuration to serve the Angular PWA and forward the APIs to the backend.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Angular static files with SPA fallback:
    # any client-side route falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api calls are forwarded to the Spring Boot backend.
    # "backend" is the service name in docker-compose.yml.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
