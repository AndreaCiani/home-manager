# Orchestration of the 3 home-manager services.
# Start with:  docker compose up --build
#
# This file describes the "release" configuration (frontend served by Nginx).
# For development with hot reload see docs/02-architecture.md.

services:
  # ---------------------------------------------------------------
  # 🐘 PostgreSQL database
  # ---------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: hm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-homemanager}
      POSTGRES_USER: ${POSTGRES_USER:-homemanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homemanager}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # The port is exposed locally only for debugging convenience.
    # In production do NOT expose the database to the outside.
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-homemanager}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------
  # ☕ Spring Boot backend (REST API)
  # ---------------------------------------------------------------
  backend:
    build: ./backend
    container_name: hm-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/homemanager}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-homemanager}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-homemanager}
    # Uploaded document files persist in a named volume.
    volumes:
      - docdata:/data/documents
    ports:
      - "8080:8080"

  # ---------------------------------------------------------------
  # 🅰️ Angular frontend (PWA) served by Nginx
  # ---------------------------------------------------------------
  frontend:
    build: ./frontend
    container_name: hm-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  pgdata:
  docdata:
