# Test configuration: in-memory H2, schema recreated per run.
spring:
  datasource:
    url: jdbc:h2:mem:homemanager;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

# Uploaded files go under the build directory during tests.
app:
  storage:
    dir: target/test-documents
