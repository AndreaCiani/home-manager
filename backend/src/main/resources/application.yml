spring:
  application:
    name: home-manager

  datasource:
    # Values overridable via environment variables (see .env.example).
    # Locally without Docker you can point to localhost.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/homemanager}
    username: ${SPRING_DATASOURCE_USERNAME:homemanager}
    password: ${SPRING_DATASOURCE_PASSWORD:homemanager}

  jpa:
    hibernate:
      # The schema is managed by Flyway; Hibernate only validates against it.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    # Adopt an existing Hibernate-created schema without re-running the baseline.
    baseline-on-migrate: true
    baseline-version: 1

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

app:
  registration:
    # false = invite-only (no new households from the public URL; the first
    # account still bootstraps). Set REGISTRATION_OPEN=false in production.
    open: ${REGISTRATION_OPEN:true}
  storage:
    # Where uploaded document files are stored (a Docker volume in production).
    dir: ${APP_STORAGE_DIR:/data/documents}

server:
  port: 8080
  # Behind Nginx/Cloudflare, trust X-Forwarded-* so the app knows it's on HTTPS.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        # Set COOKIE_SECURE=true in production (HTTPS) so the session cookie
        # is never sent over plain HTTP. Left false for local http development.
        secure: ${COOKIE_SECURE:false}

# Common prefix for all APIs
# (controllers already use /api/... so this is only indicative)
